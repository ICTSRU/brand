<!-- SRU Brand Kit v1.1 — inline styles for Google Apps Script (HtmlService).
     Apps Script's sandboxed iframe does NOT load external <link> stylesheets from
     non-Google domains, so Apps Script projects EMBED this file instead of linking
     to /brand/css/*.css. Mirrors css/sru-shell.css + css/sru-tech-bg.css (v1.1).

     Usage:
       1) Add this file to the project (Apps Script editor: + > HTML, name it "BrandStyles").
       2) In your Index.html <head>, AFTER your own <style>, add:
            <?!= include('BrandStyles') ?>
       3) Make sure the project has the standard include() helper:
            function include(f){ return HtmlService.createHtmlOutputFromFile(f).getContent(); }
     Markup: white bar = .sru-brandbar | header band = .hero.sru-tech-bg | footer = .sru-footer.sru-tech-bg-dark -->
<style>
/* ===== SRU Shell — brand bar + footer (v1.1) ===== */
.sru-brandbar{background:#fff;border-bottom:1px solid rgba(80,30,140,.12)}
.sru-brandbar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.sru-brandbar img{display:block;height:40px;width:auto;max-width:46%}
@media (max-width:480px){.sru-brandbar img{height:32px}}

.sru-footer{color:#fff}
.sru-footer .in{max-width:1100px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.sru-support{direction:ltr;background:#fff;color:#3a1464;border-radius:4px;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-family:'Cairo',Tahoma,Arial,sans-serif}
.sru-support b{font-weight:800}
.sru-support .star{font-size:26px;font-weight:800;line-height:.6;padding-top:8px;color:#501e8c}
.sru-support .or{color:#6b5a80}
.sru-support a{color:#501e8c;font-weight:800;text-decoration:none}
.sru-itoc{display:block;background:#fff;border-radius:4px;padding:5px 9px;line-height:0}
.sru-itoc img{height:40px;width:auto;display:block}
.sru-itoc:focus-visible,.sru-support a:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media print{.sru-footer{display:none}}

/* ===== SRU Tech Background — network (v1.1) ===== */
/* ===== SRU Tech Background · Network (نمط الخلفية التقنية — شبكة متصلة متحركة) · v1.0 ===== */
.sru-tech-bg,.sru-tech-bg-dark{position:relative;overflow:hidden;isolation:isolate}
.sru-tech-bg{background:#501e8c linear-gradient(110deg,#501e8c 0%,#4a1f8a 50%,#2b3f9e 100%)}

@keyframes sruNetDrift{from{background-position:0 0}to{background-position:-520px 0}}
@media (prefers-reduced-motion:reduce){.sru-tech-bg::before,.sru-tech-bg-dark::before{animation:none}}
@media print{.sru-tech-bg,.sru-tech-bg-dark{background:#fff!important}.sru-tech-bg::before,.sru-tech-bg-dark::before{display:none}}
/* ===== end SRU Tech Background ===== */
</style>
